<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Challenge - Amir</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef6ff;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.box {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px #bbb;
}

h1 { color: #1677ff; }

button {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  background: #e8f1ff;
}

button:hover {
  background: #cfe2ff;
}

#next {
  background: #1677ff;
  color: white;
  display: none;
}

#result {
  font-size: 22px;
  font-weight: bold;
  margin: 15px;
}
</style>
</head>

<body>

<div class="box">
  <h1>🇬🇧 Amir's English Challenge</h1>
  <p>10 tappe – Vediamo quanto sei forte in inglese! 💪</p>

  <h2 id="step"></h2>
  <h2 id="question"></h2>

  <div id="answers"></div>

  <div id="result"></div>

  <button id="next" onclick="nextQuestion()">Prossima tappa ➜</button>
</div>

<script>
const quiz = [
 {q:"What is the English word for GATTO?",a:["Dog","Cat","Bird"],c:1},
 {q:"Complete: I ___ nine years old.",a:["am","is","are"],c:0},
 {q:"What colour is the sun usually drawn?",a:["Yellow","Blue","Black"],c:0},
 {q:"What is the opposite of BIG?",a:["Tall","Small","Fast"],c:1},
 {q:"Translate: CASA",a:["School","House","Car"],c:1},
 {q:"Complete: She ___ my friend.",a:["am","are","is"],c:2},
 {q:"Which one is an animal?",a:["Table","Tiger","Pencil"],c:1},
 {q:"What number comes after eleven?",a:["Ten","Twelve","Twenty"],c:1},
 {q:"Translate: BUONGIORNO",a:["Good morning","Good night","Goodbye"],c:0},
 {q:"Complete: I like ___ football.",a:["playing","playeds","plays"],c:0}
];

let current = 0;
let score = 0;

function showQuestion(){
  document.getElementById("step").innerText =
    "Tappa " + (current+1) + " di 10";

  document.getElementById("question").innerText =
    quiz[current].q;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  quiz[current].a.forEach((answer,index)=>{
    const b = document.createElement("button");
    b.innerText = answer;
    b.onclick = ()=>checkAnswer(index);
    answers.appendChild(b);
  });

  document.getElementById("result").innerText="";
  document.getElementById("next").style.display="none";
}

function checkAnswer(index){
  const buttons =
    document.getElementById("answers").querySelectorAll("button");

  buttons.forEach(b=>b.disabled=true);

  if(index === quiz[current].c){
    score++;
    document.getElementById("result").innerText="✅ Bravo Amir!";
  } else {
    document.getElementById("result").innerText="❌ Quasi! Riprova alla prossima.";
  }

  document.getElementById("next").style.display="block";
}

function nextQuestion(){
  current++;

  if(current < quiz.length){
    showQuestion();
  } else {
    document.querySelector(".box").innerHTML =
      "<h1>🏆 Test completato!</h1>" +
      "<h2>Amir ha ottenuto " + score + " / 10</h2>" +
      "<p>Ottimo lavoro! 🇬🇧👏</p>";
  }
}

showQuestion();
</script>

</body>
</html>
